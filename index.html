<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151310">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MTG Glossary</title>
<style>
  :root{
    --bg:#151310; --panel:#1e1b17; --panel-edge:#3a342b;
    --ink:#e9e3d4; --ink-dim:#a89f8c; --brass:#c9a45c; --brass-dim:#8a7443;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.5;
    padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(var(--bg) 82%, rgba(21,19,16,0));
    padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
  }
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-size:1.05rem; font-weight:700; letter-spacing:.04em;
    color:var(--brass); text-align:center; margin-bottom:10px;
  }
  h1 .tap{display:inline-block; margin-right:.35em; font-weight:900; -webkit-text-stroke:.04em currentColor;}
  .titlebar{display:flex; align-items:center; justify-content:center; position:relative;}
  #dl{
    position:absolute; right:0; top:50%; transform:translateY(-50%);
    display:inline-flex; align-items:center; gap:.25em;
    font-size:.72rem; font-weight:600; letter-spacing:.02em;
    color:var(--brass); background:transparent;
    border:1px solid var(--brass-dim); border-radius:999px;
    padding:5px 10px; cursor:pointer; white-space:nowrap;
  }
  #dl:active{background:var(--panel);}
  #dl:disabled{opacity:.6;}
  #dl[hidden]{display:none;}
  #ver{font-size:.68rem; color:var(--ink-dim); text-align:center; padding-top:4px;}
  #ver a{color:var(--brass-dim);}
  .searchwrap{position:relative;}
  #q{
    width:100%; padding:14px 44px 14px 16px;
    font-size:1.05rem; color:var(--ink);
    background:var(--panel); border:1.5px solid var(--panel-edge);
    border-radius:999px; outline:none;
  }
  #q:focus{border-color:var(--brass);}
  #q::placeholder{color:var(--ink-dim);}
  #clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; border-radius:50%;
    border:none; background:transparent; color:var(--ink-dim);
    font-size:1.2rem; line-height:1; cursor:pointer; display:none;
  }
  .chips{
    display:flex; gap:6px; overflow-x:auto; padding:10px 2px 2px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:6px 12px; font-size:.8rem;
    color:var(--ink-dim); background:var(--panel);
    border:1px solid var(--panel-edge); border-radius:999px; cursor:pointer;
  }
  .chip.on{color:var(--bg); background:var(--brass); border-color:var(--brass); font-weight:600;}
  #count{font-size:.75rem; color:var(--ink-dim); text-align:center; padding-top:8px;}
  main{padding:4px 14px;}
  .entry{
    background:var(--panel); border:1px solid var(--panel-edge);
    border-left:3px solid var(--brass-dim);
    border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;
  }
  .entry h2{
    font-family:Georgia,'Times New Roman',serif;
    font-size:1.02rem; font-weight:700; color:var(--ink);
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 8px;
    overflow-wrap:anywhere;
  }
  .entry h2 .nm{flex:1 1 auto; min-width:0; overflow-wrap:anywhere;}
  .entry h2 .cat{
    font-family:system-ui,sans-serif; font-size:.65rem; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:var(--brass-dim);
    white-space:nowrap;
  }
  .entry p{font-size:.92rem; color:var(--ink); margin-top:5px;}
  .entry ul{margin:6px 0 0 18px; font-size:.92rem;}
  .entry li{margin-bottom:4px;}
  .entry.card{border-left-color:#5a7d9a;}
  .entry .mana{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--ink-dim);white-space:nowrap;}
  .entry .typeline{font-size:.78rem;color:var(--ink-dim);margin-top:2px;}
  .ms{
    display:inline-flex; align-items:center; justify-content:center;
    width:1.25em; height:1.25em; border-radius:50%;
    font-family:system-ui,sans-serif; font-size:.8rem; font-weight:700;
    line-height:1; vertical-align:-0.22em; margin:0 1px;
    box-sizing:border-box; padding-top:.13em;
    color:#1c1a16; background:#b8b0a0;
  }
  .ms.w{background:#f2ecd8;} .ms.u{background:#79b3d4;} .ms.b{background:#a89bb0;}
  .ms.r{background:#d98d78;} .ms.g{background:#8fbf94;}
  .ms .tp{
    display:inline-block; transform:translateY(-13%);
    font-weight:900; -webkit-text-stroke:.05em currentColor;
  }
  .ms.wide{width:auto; min-width:1.25em; padding:0 4px; border-radius:999px; font-size:.68rem;}
  mark{background:var(--brass); color:var(--bg); border-radius:3px; padding:0 2px;}
  #empty{
    display:none; text-align:center; color:var(--ink-dim);
    padding:48px 24px; font-size:.95rem;
  }
  #empty strong{color:var(--ink);}
  @media (prefers-reduced-motion: no-preference){
    .entry{animation:fade .15s ease-out;}
    @keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}
  }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1><span class="tap">↷</span>MTG GLOSSARY</h1>
    <button id="dl" title="Install this app on your device" hidden>⬇ Install</button>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Search a term… e.g. ward, trample" autocomplete="off" autofocus>
    <button id="clear" aria-label="Clear search">✕</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="count"></div>
  <div id="ver"></div>
</header>
<main id="list"></main>
<div id="empty">No match for “<strong id="emptyq"></strong>”.<br>Try a shorter word, or ask Claude — it might be a newer mechanic not in this list yet.</div>

<script>
const CATS = ["Keywords","Reading Cards","Commander","Terms","Old & Niche","Cards"];
// d supports plain text or simple HTML (lists for multi-rule entries)
const DATA = [{"t":"Deathtouch","c":"Keywords","d":"Any amount of damage this deals to a creature is enough to destroy it. Even 1 damage kills."},{"t":"Defender","c":"Keywords","d":"This creature can't attack (usually a wall). It can still block."},{"t":"Double strike","c":"Keywords","d":"Deals combat damage twice: once at the first-strike step, once at the normal step."},{"t":"Enchant","c":"Keywords","d":"(On Auras) Tells you what the Aura can be attached to, e.g. \"Enchant creature.\""},{"t":"Equip","c":"Keywords","d":"Pay the equip cost to attach an Equipment to a creature you control. Only at sorcery speed (your main phase, empty stack)."},{"t":"First strike","c":"Keywords","d":"Deals its combat damage before creatures without first strike. If it kills the blocker/attacker first, that creature never deals damage back."},{"t":"Flash","c":"Keywords","d":"You can cast this any time you could cast an instant (including on opponents' turns)."},{"t":"Flying","c":"Keywords","d":"Can only be blocked by creatures with flying or reach."},{"t":"Haste","c":"Keywords","d":"Can attack and use tap abilities the turn it comes under your control. Ignores \"summoning sickness.\""},{"t":"Hexproof","c":"Keywords","d":"Can't be the target of spells or abilities your opponents control. (You can still target your own.)"},{"t":"Indestructible","c":"Keywords","d":"Can't be destroyed by damage or by \"destroy\" effects. (Can still be exiled, sacrificed, or die to -X/-X toughness reduction.)"},{"t":"Lifelink","c":"Keywords","d":"Damage this deals also causes you to gain that much life."},{"t":"Menace","c":"Keywords","d":"Can't be blocked except by two or more creatures."},{"t":"Protection","c":"Keywords","d":"Protection from [quality] — remember DEBT: can't be Damaged, Enchanted/Equipped, Blocked, or Targeted by anything with that quality."},{"t":"Reach","c":"Keywords","d":"Can block creatures with flying (even though it can't fly itself)."},{"t":"Trample","c":"Keywords","d":"If it has more power than the total toughness of its blockers, the excess combat damage goes to the player or planeswalker."},{"t":"Vigilance","c":"Keywords","d":"Doesn't tap when attacking, so it can still block afterward."},{"t":"Ward","c":"Keywords","d":"Whenever this becomes the target of a spell or ability an opponent controls, counter it unless they pay the ward cost."},{"t":"Tap / Untap","c":"Keywords","d":"Turn a card sideways to use it, or straighten it back up. Tapped creatures can't block."},{"t":"Scry","c":"Keywords","d":"Scry N: look at the top N cards of your library. Put any number on the bottom and the rest back on top, in any order."},{"t":"Surveil","c":"Keywords","d":"Surveil N: look at the top N cards. Put any number into your graveyard and the rest back on top in any order. (Like scry, but the alternative is the graveyard, not the bottom.)"},{"t":"Mill","c":"Keywords","d":"Mill N: put the top N cards of your library into your graveyard."},{"t":"Fight","c":"Keywords","d":"Two creatures each deal damage equal to their power to the other."},{"t":"Sacrifice","c":"Keywords","d":"Move a permanent you control to its owner's graveyard. It's a cost you choose to pay — can't be prevented by indestructible, hexproof, or protection."},{"t":"Exile","c":"Keywords","d":"Remove a card from the game (to the \"exile zone\"). Harder to recover than the graveyard."},{"t":"Proliferate","c":"Keywords","d":"Choose any number of permanents and/or players that have counters. Each gets one more counter of each kind it already has. (You choose which ones — you can skip opponents' stuff.)"},{"t":"Search / Fetch / Tutor","c":"Keywords","d":"Look through your library for a specific card. \"Tutor\" is slang for any such effect."},{"t":"Planeswalkers","c":"Keywords","d":"<ul><li>Enter with loyalty counters equal to the number in their bottom-right corner.</li><li>Activate one loyalty ability per planeswalker per turn, sorcery speed only. +N/−N adjusts loyalty; you can't pay more loyalty than it has.</li><li>Opponents can attack them directly; you can block for them as normal.</li><li>Damage removes loyalty counters. At 0 loyalty it goes to the graveyard.</li><li>The old \"redirect damage\" rule was removed in 2018 — cards that hit planeswalkers now say \"any target.\"</li><li>Legend rule applies: no two with the same name.</li></ul>"},{"t":"Vehicles","c":"Keywords","d":"<ul><li>Artifact — Vehicle. Printed power/toughness, but not a creature until crewed.</li><li>Crew N: tap untapped creatures you control with total power N or more; it becomes an artifact creature until end of turn. Works at instant speed (e.g. crew mid-combat to block).</li><li>Even summoning-sick creatures can crew.</li><li>The Vehicle itself has summoning sickness: entered this turn = can't attack even crewed (unless it has haste).</li><li>Legendary Vehicles with printed power/toughness can be your commander (2025 change).</li></ul>"},{"t":"Spacecraft & Station","c":"Keywords","d":"<ul><li>Artifact — Spacecraft (Edge of Eternities). Starts as a non-creature artifact you charge up permanently.</li><li>Station: tap another untapped creature you control to add charge counters equal to its power. Sorcery speed only, one creature per activation.</li><li>Thresholds (e.g. 2+, 8+) unlock abilities as counters accumulate; at the final threshold it becomes an artifact creature and stays one (counters aren't spent).</li><li>Proliferate and other counter effects can charge it without tapping anyone.</li><li>Legendary Spacecraft with printed power/toughness can be your commander.</li></ul>"},{"t":"Planets","c":"Keywords","d":"Land — Planet (Edge of Eternities). A nonbasic land type with no inherent rules, but current ones all have Station. They tap for mana right away and unlock a powerful extra ability once stationed to their threshold (they don't become creatures)."},{"t":"Web-slinging","c":"Keywords","d":"(Spider-Man set.) An alternative cost: cast the spell for its web-slinging cost if you also return a tapped creature you control to its owner's hand. The return is part of the cost, so it can't be responded to. Normal timing rules apply."},{"t":"Mayhem","c":"Keywords","d":"(Spider-Man set.) Cast this card from your graveyard for its mayhem cost if you discarded it this turn. You have until end of turn — no need to cast immediately — but timing rules apply. On your Swarm, Being of Bees."},{"t":"Connive","c":"Keywords","d":"Draw a card, then discard a card. If a nonland card was discarded, put a +1/+1 counter on that creature. On your Mob Lookout; a great mayhem enabler."},{"t":"Modified","c":"Keywords","d":"A category, not an ability: a creature you control is modified if it's equipped, enchanted by an Aura you control, or has any counter on it."},{"t":"Harness","c":"Keywords","d":"On Infinity Stones (your Soul Stone): a cost paid to unlock the Stone's powerful Infinity ability; until harnessed, only its basic ability works."},{"t":"More Than Meets the Eye","c":"Keywords","d":"(Transformers.) You may cast the card converted — its other face up — for this cost instead of the front face."},{"t":"Convert","c":"Keywords","d":"(Transformers.) Transform the card: turn it to its other face (bot mode ↔ alt mode). Same rules as transform."},{"t":"Living Metal","c":"Keywords","d":"(Transformers.) As long as it's your turn, this Vehicle is also a creature — no crewing needed. On opponents' turns it's a non-creature again, dodging creature removal."},{"t":"Bolster","c":"Keywords","d":"Bolster N: choose the creature with the least toughness among creatures you control (you pick on ties) and put N +1/+1 counters on it. On your Optimus Prime."},{"t":"Populate","c":"Keywords","d":"Create a token that's a copy of a creature token you control. (Rootborn Defenses.)"},{"t":"Sunburst","c":"Keywords","d":"Enters with a +1/+1 counter (creatures) or charge counter (noncreatures) for each color of mana spent to cast it. (Etched Oracle, Pentad Prism.)"},{"t":"Affinity for artifacts","c":"Keywords","d":"This spell costs 1 generic less for each artifact you control. (Thought Monitor.)"},{"t":"Phyrexian mana","c":"Keywords","d":"A hybrid symbol (colored pip with a Φ) payable with that color of mana or 2 life. (Tezzeret's Gambit, Phyrexian Metamorph.)"},{"t":"Charge counters","c":"Keywords","d":"No inherent rules — fuel that artifacts spend or accumulate (Everflowing Chalice, Lux Cannon, Darksteel Reactor, Titan Forge). Station uses them too, so proliferate ties your deck together."},{"t":"Food","c":"Keywords","d":"A predefined artifact token: pay 2 generic, tap, sacrifice it — gain 3 life. (Made by Bagel and Schmear, Hot Dog Cart.)"},{"t":"Transform / Double-faced","c":"Keywords","d":"Cards with two faces; transform flips to the other face. Spider-Man's double-faced cards are modal (cast either face from hand) and can also transform, per a 2025 rules change."},{"t":"The Ring tempts you","c":"Commander","d":"<p>(Food and Fellowship, Hosts of Mordor.) First tempting gives you The Ring emblem. Each tempting: choose a creature you control as Ring-bearer (or keep/change), and The Ring unlocks its next ability, cumulative and permanent:</p><ul><li>1. Ring-bearer is legendary and can't be blocked by creatures with greater power.</li><li>2. Whenever your Ring-bearer attacks, draw a card, then discard a card.</li><li>3. Whenever your Ring-bearer becomes blocked, the blocker's controller sacrifices it at end of combat.</li><li>4. Whenever your Ring-bearer deals combat damage to a player, each opponent loses 3 life.</li></ul><p>Each player has their own Ring and one Ring-bearer. Abilities unlock even with no creature to choose. A creature stops being Ring-bearer if it leaves or changes control; the next takes over only when you're tempted again.</p>"},{"t":"Ring-bearer","c":"Commander","d":"A designation, not a creature type or ability — see The Ring tempts you."},{"t":"Amass Orcs","c":"Keywords","d":"Amass Orcs N: put N +1/+1 counters on an Army you control; if you don't control one, first create a 0/0 black Orc Army token. The Army becomes an Orc in addition to its types. (Hosts of Mordor.)"},{"t":"The Monarch","c":"Commander","d":"(Riders of Rohan.) A game-wide crown only one player holds: the monarch draws an extra card at the beginning of their end step. Steal it by dealing combat damage to the current monarch with a creature, or via card effects."},{"t":"Voting (council)","c":"Commander","d":"(Elven Council.) Each player votes between the card's options. Will of the council: most votes wins. Council's dilemma: both effects happen, scaled by votes. Secret council: votes are made in secret and revealed simultaneously."},{"t":"Partner with","c":"Commander","d":"Frodo and Sam (or Merry and Pippin): the card names its other half, and the two can be your commanders together. When one enters, you may search your library for the other."},{"t":"Devour / Devour Food","c":"Keywords","d":"As this creature enters, you may sacrifice creatures (Devour) or Foods (Devour Food); it enters with N +1/+1 counters for each one devoured. Affinity for Food also appears: that spell costs 1 less per Food you control."},{"t":"Landcycling","c":"Keywords","d":"Like cycling, but instead of drawing you search your library for a land of the named type and put it into your hand. (Lorien Revealed's Islandcycling, in Elven Council.)"},{"t":"Adapt","c":"Keywords","d":"Adapt N: pay the cost — if this creature has no +1/+1 counters on it, put N +1/+1 counters on it. (Jetfire.)"},{"t":"Addendum","c":"Keywords","d":"Ability word: bonus if you cast the spell during your main phase. (Unbreakable Formation.)"},{"t":"Aftermath","c":"Keywords","d":"On split cards: the second half can only be cast from your graveyard, then exiles. (Dusk // Dawn.)"},{"t":"Battalion","c":"Keywords","d":"Ability word: triggers when this and at least two other creatures attack. (Frontline Medic.)"},{"t":"Choose a Background","c":"Commander","d":"Commander variant of Partner: this commander can pair with a Background enchantment as a second commander. (Lae'zel.)"},{"t":"Converge","c":"Keywords","d":"Ability word: counts how many colors of mana were spent to cast the spell. (Crystalline Crawler.)"},{"t":"Dash","c":"Keywords","d":"Alternative cost: it gains haste, and returns to your hand at the beginning of the next end step. (Flamerush Rider, Riders of Rohan.)"},{"t":"Dethrone","c":"Keywords","d":"Whenever this attacks the player with the most life (or tied for most), put a +1/+1 counter on it. (Scourge of the Throne.)"},{"t":"Discover","c":"Keywords","d":"Discover N: exile cards from your library until you hit a nonland card with mana value N or less; cast it free or put it in hand, rest on bottom randomized. A fixed-size cascade. (Long-Range Sensor.)"},{"t":"Encore","c":"Keywords","d":"Exile this card from your graveyard: for each opponent, create a hasty token copy that attacks that opponent; sacrifice them at end step. Sorcery speed. (Kangee's Lieutenant.)"},{"t":"Exert","c":"Keywords","d":"You may exert a creature as it attacks for a bonus; an exerted creature doesn't untap during your next untap step. (Combat Celebrant.)"},{"t":"Flavor words","c":"Reading Cards","d":"Italic labels like Fateful Bite, Mind Swap, Vibro-Shock Gauntlets, Web Support on Spider-Man (and D&D) cards have NO rules meaning — pure flavor naming an ability. Only the text after the dash matters."},{"t":"Goad","c":"Keywords","d":"A goaded creature attacks each combat if able, and attacks a player other than you if able. Political weapon. (Shiny Impetus, Taunt from the Rampart.)"},{"t":"Hideaway","c":"Keywords","d":"Hideaway N: when this land enters, look at the top N cards, exile one face down, bottom the rest; play the exiled card later once the condition is met. (Windbrisk Heights.)"},{"t":"Improvise","c":"Keywords","d":"Your artifacts can help cast this spell: each artifact you tap pays for 1 generic. Kilo tapping to Improvise is what triggers her proliferate. (Kappa Cannoneer, Organic Extinction, Universal Surveillance.)"},{"t":"Incubate","c":"Keywords","d":"Incubate X: create an Incubator token with X +1/+1 counters and a 2-mana Transform ability — it flips into a 0/0 Phyrexian artifact creature, keeping the counters as stats. (Chrome Host Seedshark.)"},{"t":"Islandwalk / Landwalk","c":"Keywords","d":"Can't be blocked as long as the defending player controls a land of that type. (Colossal Whale.)"},{"t":"Lieutenant","c":"Keywords","d":"Ability word: bonus as long as you control your commander. (Loyal Guardian, Thunderfoot Baloth.)"},{"t":"Miracle","c":"Keywords","d":"You may cast it for its miracle cost when you draw it, if it's the first card you've drawn this turn. Reveal it immediately as you draw. (Devastation Tide.)"},{"t":"Multikicker","c":"Keywords","d":"Kicker you can pay any number of times. (Everflowing Chalice, Marshal's Anthem.)"},{"t":"Regenerate","c":"Keywords","d":"Replaces destruction: the next time the creature would be destroyed this turn, instead tap it, remove it from combat, and it survives. (Asceticism grants this.)"},{"t":"Revolt","c":"Keywords","d":"Ability word: bonus if a permanent left the battlefield under your control this turn. (Call for Unity.)"},{"t":"Skulk","c":"Keywords","d":"Can't be blocked by creatures with greater power. (Gollum, Obsessed Stalker — the same evasion The Ring gives your Ring-bearer.)"},{"t":"Treasure","c":"Keywords","d":"Predefined artifact token: tap and sacrifice it to add one mana of any color. Nine of your cards make them (Gimli of the Glittering Caves, Prosperous Innkeeper, Cavern-Hoard Dragon...)."},{"t":"Undaunted","c":"Keywords","d":"This spell costs 1 generic less for each opponent — a Commander-designed discount. (Seeds of Renewal.)"},{"t":"Warp","c":"Keywords","d":"(Edge of Eternities.) Cast the card from hand for its warp cost; exile it at the beginning of the next end step, then you may cast it again from exile on a later turn. Your Timeline Culler can even warp from the graveyard."},{"t":"Plan","c":"Keywords","d":"(Marvel Super Heroes.) A new enchantment subtype. A Plan gains plan counters as you take the action it names, and delivers a big payoff once it reaches its counter threshold. E.g. Age of Ultron builds a Cosmic Cube toward a seventh plan counter."},{"t":"Power-Up","c":"Keywords","d":"(Marvel Super Heroes.) A one-shot activated ability that puts +1/+1 counters on the creature plus a bonus. Activate each power-up ability only once, and reduce its cost by the creature's mana cost if it entered this turn."},{"t":"Hero (typal)","c":"Keywords","d":"A creature type shared by most Avengers/Fantastic Four cards. Avengers Assemble rewards Heroes entering: Captain America gives each Hero that enters (and himself) a +1/+1 counter plus vigilance and haste for the turn."},{"t":"Villain (typal)","c":"Keywords","d":"The counterpart creature type across Doom Prevails. Cards reward Villains entering, attacking, or conniving; Loki, the Deceiver copies your Villains, and Ultron makes Robot Villain tokens whenever a creature connives."},{"t":"Vibranium","c":"Keywords","d":"A predefined artifact token from Wakanda Forever: indestructible, taps for {C} that can only be spent on artifact spells. T'Challa makes one whenever he enters or attacks; the deck cares about casting expensive artifacts."},{"t":"Spell (on the stack)","c":"Reading Cards","d":"A card or copy while it's on the stack. A creature already on the battlefield is a permanent, not a spell — 'counter target spell' can't touch it there, only on the way in. Anything that isn't a land is a spell while on the stack."},{"t":"Cost vs effect (the colon)","c":"Reading Cards","d":"In an activated ability, everything before the colon is the cost and everything after is the effect. No cost, no activation — an ability costing 'remove a charge counter' can't be used at zero counters. Keyword abilities are activated abilities too, even when the colon only shows in reminder text."},{"t":"Triggered ability","c":"Reading Cards","d":"Starts with when, whenever, or at. It uses the stack, so it can be responded to, copied (panharmonicon-style), or countered by a stifle effect. ETB (enters-the-battlefield) triggers are the common case."},{"t":"Replacement effect","c":"Reading Cards","d":"Uses if / instead (or 'enters with'). Doesn't use the stack and can't be responded to — it silently changes an event as it happens. Damage doublers, token doublers, 'if it would die, exile instead'. With two on one event, the affected player's side chooses the order, not you."},{"t":"As ~ enters","c":"Reading Cards","d":"Happens on the way to the battlefield, before it's actually in play. Not a trigger — can't be stifled, doubled, or shut off by Torpor Orb. Why clones and Metallic Mimic work, and why a cloned 0/0 doesn't die."},{"t":"Enters with counters","c":"Reading Cards","d":"The permanent simply arrives with the counters (Walking Ballista, Everflowing Chalice, Giada). No trigger, no window to respond, and a self-referencing counter-giver doesn't count itself."},{"t":"Target","c":"Reading Cards","d":"If the word Target appears, it's targeted: locked in as you put it on the stack, must be legal or you can't cast, and stopped by hexproof/shroud/protection/ward. 'Choose' with no 'target' is NOT targeting (Council's Judgment, clones dodge hexproof this way). But 'choose target' still targets."},{"t":"Fizzle","c":"Reading Cards","d":"A spell/ability with one target does nothing if that target becomes illegal before it resolves. With multiple targets it still resolves for the ones that remain, only fully fizzling when every target is gone. Multi-target spells like Decimate also can't be cast without a legal target for each."},{"t":"Next end step vs until end of turn","c":"Reading Cards","d":"'At the beginning of the next end step' is a trigger (stackable, stifle-able; activate Kiki-Jiki on an opponent's end step to keep a token an extra turn). 'Until end of turn' is not a trigger — it wears off in cleanup and nothing stops it (why threaten-and-sac, or phasing out a stolen creature, works)."},{"t":"Cast / play / put","c":"Reading Cards","d":"'Cast' uses the stack (counterable; triggers 'whenever you cast'). 'Put onto the battlefield' skips all that — no cast triggers, nothing to counter (Lurking Predators vs Descendant's Path). For double-faced cards you only pick a face when you cast or play it; anything that puts it (reanimation) only sees the front face."},{"t":"Play a land vs put a land","c":"Reading Cards","d":"Playing a land is a game action, not a spell — it doesn't use the stack. 'Put a land onto the battlefield' (Growth Spiral, Burgeoning) is not playing it, so it won't trigger 'whenever you play a land' effects like Horn of Greed, and doesn't use your land-for-turn."},{"t":"May","c":"Reading Cards","d":"Optional. Consecrated Sphinx ('you may draw two') is a choice; Archmage Emeritus (no 'may') forces the draw — dangerous with an empty library. Small word, big difference."},{"t":"Up to N","c":"Reading Cards","d":"You may choose zero. Apex Altisaur's 'fights up to one' means you don't have to keep fighting until it dies."},{"t":"One or more","c":"Reading Cards","d":"Counts events, not creatures. 'Whenever one or more creatures you control deal combat damage to a player' rewards you once per player hit — spreading damage across three opponents triggers it three times (Professional Face-Breaker, Grim Hireling)."},{"t":"Each / other","c":"Reading Cards","d":"'Each' often means every player's turn or upkeep, not just yours — easy to under-use. 'Other' excludes the card itself: a lord granting 'other creatures you control' hexproof does not protect itself."},{"t":"What damage counts","c":"Reading Cards","d":"'Deals damage' = any damage. 'Combat damage' = only in combat, but to anything. 'Combat damage to a player' is the most restrictive. Scaling payoffs care which one it is."},{"t":"Airbend","c":"Keywords","d":"(Avatar.) To airbend a creature, exile it; while exiled, its OWNER may cast it for {2} rather than its mana cost. So it's removal that hands the card back cheaply — great on your own enters-the-battlefield creatures, riskier aimed at opponents."},{"t":"Ward—Waterbend","c":"Keywords","d":"(Avatar.) A hybrid: ward whose cost is a waterbend cost. The OPPONENT must pay it to keep their spell, and they may tap their own artifacts and creatures to help pay — so a wide opposing board makes the ward easier for them to beat."},{"t":"Mentor","c":"Keywords","d":"Whenever this creature attacks, put a +1/+1 counter on target attacking creature with LESSER power. The target must be attacking and must be smaller, so mentor tends to lift your weakest attacker first."},{"t":"Firebending","c":"Keywords","d":"(Avatar.) Firebending N: whenever this creature attacks, add N red mana. That mana lasts until end of combat, so it's attack-triggered ramp you must spend during combat — think combat tricks and pump, not sorcery-speed plays."},{"t":"Waterbend","c":"Keywords","d":"(Avatar.) An activated ability with a special cost: while paying a waterbend cost you may tap your untapped artifacts and creatures to help, each paying 1 generic. Effectively Convoke/Improvise combined, and it applies only to that ability's cost."},{"t":"Earthbend","c":"Keywords","d":"(Avatar.) Earthbend N: target land you control becomes a 0/0 creature with haste that's still a land, then gets N +1/+1 counters. If it dies or is exiled it returns to the battlefield tapped — so the land isn't permanently lost."},{"t":"Exhaust","c":"Keywords","d":"A one-shot activated ability: activate each exhaust ability only once per game. Often gated to your turn. Debuted in Aetherdrift and reused in Avatar; same design space as Marvel's Power-Up."},{"t":"Saddle","c":"Keywords","d":"Saddle N: tap any number of OTHER creatures you control with total power N or more to make this Mount saddled until end of turn. Sorcery speed only. Like Crew, but the Mount is already a creature — saddling just switches on its bonus ability."},{"t":"Fabricate","c":"Keywords","d":"Fabricate N: when this creature enters, choose either N +1/+1 counters on it, or N 1/1 colorless Servo artifact creature tokens. (Cayth, Marionette Master.)"},{"t":"Modular","c":"Keywords","d":"Modular N: enters with N +1/+1 counters; when it dies, you may move those counters onto target artifact creature. (Blaster.)"},{"t":"Myriad","c":"Keywords","d":"Whenever this attacks, for each opponent other than the defending player, you may create a tapped attacking token copy attacking that player. Exile the tokens at end of combat — a multiplayer-only powerhouse."},{"t":"Embalm","c":"Keywords","d":"Pay the embalm cost and exile this from your graveyard: create a token copy of it, except it's a white Zombie version with no mana cost. Sorcery speed. (Sacred Cat.)"},{"t":"Outlast","c":"Keywords","d":"Pay the outlast cost and tap: put a +1/+1 counter on this creature. Sorcery speed only, so it competes with attacking. (Abzan Falconer.)"},{"t":"Imprint","c":"Keywords","d":"Ability word on artifacts that exile a card to 'remember' it, then grant an effect based on the exiled card. (Semblance Anvil.)"},{"t":"Raid","c":"Keywords","d":"Ability word: checks whether you attacked with a creature this turn, granting a bonus if you did. (Cruel Administrator.)"},{"t":"Heroic","c":"Keywords","d":"Ability word: triggers whenever you cast a spell that TARGETS this creature — your own auras and pump spells turn it on. (Vanguard of Brimaz.)"},{"t":"Inspired","c":"Keywords","d":"Ability word: triggers whenever this creature becomes untapped, so it rewards attacking then untapping next turn. (Oreskos Sun Guide.)"},{"t":"Formidable","c":"Keywords","d":"Ability word: checks whether creatures you control have total power 8 or greater. (Ultra Magnus — hitting formidable converts him.)"},{"t":"Fuse","c":"Keywords","d":"On split cards: you may cast one or both halves from your hand. (Wear // Tear.)"},{"t":"Affinity for [type]","c":"Keywords","d":"This spell costs 1 generic less for each permanent of the named type you control — Allies, Cats, artifacts, etc. (Allies at Last, Claws Out.)"},{"t":"Typecycling","c":"Keywords","d":"Forestcycling, Islandcycling and friends: pay the cost and discard the card to search your library for a land (or card) of that type and put it into your hand, then shuffle. Unlike normal cycling you get a specific card, not a random draw."},{"t":"Job select","c":"Keywords","d":"(Final Fantasy.) On Equipment: when it enters, create a 1/1 colorless Hero creature token, then attach this Equipment to it. The Equipment brings its own wielder, so it's never a dead card on an empty board."},{"t":"Tiered","c":"Keywords","d":"(Final Fantasy.) Choose one additional cost. The card lists several modes, each with its own extra cost — pay the tier you want and get that mode's effect. Bigger tier, bigger cost, bigger effect."},{"t":"Summon (Saga creatures)","c":"Keywords","d":"(Final Fantasy.) The Summon cards are Enchantment Creature — Saga. They gain a lore counter as they enter and after your draw step, fire chapter abilities I/II/III in order, and are sacrificed after the final chapter — while also being a creature the whole time."},{"t":"Foretell","c":"Keywords","d":"During your turn you may pay {2} and exile this card from your hand face down. Cast it on a LATER turn for its foretell cost — splitting the cost across two turns and hiding what it is."},{"t":"Evolve","c":"Keywords","d":"Whenever a creature you control enters, if it has greater power OR toughness than this creature, put a +1/+1 counter on this creature. Only one counter per trigger, no matter how much bigger."},{"t":"Escalate","c":"Keywords","d":"On modal spells: pay the escalate cost for each mode chosen beyond the first. Costs can be mana or something else (tapping a creature, discarding)."},{"t":"Delve","c":"Keywords","d":"Each card you exile from your graveyard while casting this spell pays for {1}. Turns a full graveyard into a huge discount — but competes with graveyard recursion."},{"t":"Undying","c":"Keywords","d":"When this creature dies, if it had NO +1/+1 counters on it, return it to the battlefield under its owner's control with a +1/+1 counter on it — so it comes back once, then stays dead. Persist is the mirror version: same idea, but with a -1/-1 counter, so it only works on a creature that hasn't already been shrunk."},{"t":"Unearth","c":"Keywords","d":"An activated ability from the graveyard: pay the cost to return this card to the battlefield with haste, then exile it at the next end step. Sorcery speed. It's an ability, not a spell — so a normal counterspell can't stop it."},{"t":"Blitz","c":"Keywords","d":"An alternative cost: cast it for the blitz cost and it gains haste plus 'when this creature dies, draw a card', but you sacrifice it at the beginning of the next end step."},{"t":"Intimidate","c":"Keywords","d":"This creature can't be blocked except by artifact creatures and/or creatures that share a color with it."},{"t":"Plainscycling","c":"Keywords","d":"A typecycling variant: pay the cost and discard this card to search your library for a Plains card and put it into your hand, then shuffle. (See also Forestcycling, Islandcycling, Mountaincycling.)"},{"t":"Storied","c":"Keywords","d":"(The Hobbit.) A check, not an ability: if you control three or more artifacts, legendaries and/or Sagas, you gain an enduring story for the REST OF THE GAME. Once it switches on it never turns off, even if your board is wiped — so hitting the threshold once is permanent."},{"t":"Enduring story","c":"Keywords","d":"(The Hobbit.) The permanent game state that Storied unlocks. Cards read 'as long as you have an enduring story' and grant ongoing bonuses — ward on your team, +1/+1 to creatures, free equips, a Propaganda-style attack tax. It's a designated player state, not a permanent, so it can't be removed."},{"t":"Gift a [thing]","c":"Keywords","d":"As you cast the spell you may promise an opponent a gift — a card, a Treasure, a tapped Fish, etc. If you do, they receive it BEFORE the spell's other effects, and the spell usually gets substantially better in return. Choosing to gift is optional and locked in at cast time."},{"t":"Equip [quality]","c":"Keywords","d":"A cheaper equip cost restricted to a creature type — e.g. Bilbo's Ring can equip a Halfling for {1} or any creature for {4}. Both costs are on the card; you choose which to pay. Still sorcery speed."},{"t":"Prepared / Prepare","c":"Keywords","d":"(Secrets of Strixhaven.) These cards are a creature on the front with a spell on the back. The creature enters prepared, or becomes prepared from a trigger. While it IS prepared you may cast a COPY of its spell — the creature stays on the battlefield and the card never leaves; casting the copy just unprepares it. Because triggers can re-prepare the same creature, one card can fire its spell repeatedly. Only creatures that have a prepare spell can become prepared, so outside effects that grant 'prepared' only work on them."},{"t":"Cycling","c":"Keywords","d":"Pay the cycling cost and discard this card to draw a card. Lets a \"dead\" card become a fresh draw."},{"t":"Convoke","c":"Keywords","d":"You can tap untapped creatures to help pay for this spell (each pays 1 generic or one mana of its color)."},{"t":"Flashback","c":"Keywords","d":"Cast this from your graveyard for its flashback cost, then exile it afterward."},{"t":"Kicker","c":"Keywords","d":"An optional extra cost you can pay as you cast the spell for a bonus effect."},{"t":"Prowess","c":"Keywords","d":"Whenever you cast a noncreature spell, this creature gets +1/+1 until end of turn."},{"t":"Morph","c":"Keywords","d":"You may cast the card face down as a 2/2 for three generic mana. Turn it face up any time by paying its morph cost."},{"t":"Cascade","c":"Keywords","d":"When you cast this, exile cards from the top of your library until you hit a cheaper nonland card; you may cast that one for free. The rest go to the bottom in random order."},{"t":"Flicker / Blink","c":"Keywords","d":"(Common slang/wording, not a keyword.) Exile a permanent and immediately return it. Resets it and re-triggers \"enters the battlefield\" abilities."},{"t":"Landfall","c":"Keywords","d":"Triggers whenever a land enters the battlefield under your control. (Ability words are italic labels with no rules of their own — the card text says what happens.)"},{"t":"Constellation","c":"Keywords","d":"Triggers whenever an enchantment enters under your control."},{"t":"Threshold","c":"Keywords","d":"Gets a bonus if seven or more cards are in your graveyard."},{"t":"Delirium","c":"Keywords","d":"Gets a bonus if four or more card types are among cards in your graveyard."},{"t":"Metalcraft","c":"Keywords","d":"Gets a bonus if you control three or more artifacts."},{"t":"Commander / General","c":"Commander","d":"The legendary creature leading your 100-card singleton deck. Legendary Vehicles and Spacecraft with printed power/toughness can now also be commanders (2025 change); some other cards say explicitly they can be your commander."},{"t":"Command Zone","c":"Commander","d":"Where your commander starts. If it would go to the graveyard, exile, hand, or library, you may put it back here instead."},{"t":"Commander tax","c":"Commander","d":"Each time you cast your commander from the command zone, it costs 2 generic more per previous cast this game."},{"t":"Commander damage","c":"Commander","d":"A player dealt 21 or more combat damage by the same single commander over the game loses. Tracked per commander, even across zone changes."},{"t":"Color identity","c":"Commander","d":"All mana symbols in a card's cost and rules text, plus color indicators. Every card in your deck must fit within your commander's color identity. Hybrid mana counts as both colors."},{"t":"Singleton","c":"Commander","d":"Only one copy of each card allowed (except basic lands)."},{"t":"Partner","c":"Commander","d":"A keyword letting you run two commanders, if both have Partner."},{"t":"Companion","c":"Commander","d":"If your deck meets the card's condition, reveal it from outside the game before starting. Once per game, at sorcery speed, pay 3 generic to put it into your hand, then cast it normally."},{"t":"Brackets","c":"Commander","d":"The official power-level system (2025, still in beta). Five tiers: 1 Exhibition (theme/flavor), 2 Core (precon-level), 3 Upgraded, 4 Optimized, 5 cEDH. Used in the Rule 0 conversation to match power levels."},{"t":"Game Changers","c":"Commander","d":"An official Wizards-maintained list (~53 cards as of early 2026) of format-warping cards like Rhystic Study and Demonic Tutor. Brackets 1–2 exclude them, Bracket 3 allows up to three, 4–5 unlimited."},{"t":"Rule 0","c":"Commander","d":"The pregame conversation where the table agrees on expectations: power level/bracket, proxies, house rules."},{"t":"cEDH","c":"Commander","d":"Competitive EDH. Commander played at maximum power with fully optimized decks."},{"t":"Mana symbols","c":"Terms","d":"{W} White, {U} blUe (B was taken by Black), {B} Black, {R} Red, {G} Green. A number like {3} is generic (any mana), {C} requires specifically colorless, {T} is tap, {X} is an amount you choose, and split symbols like {U/P} are Phyrexian (pay the color or 2 life). Order in a cost doesn't matter, but colored symbols define color identity in Commander."},{"t":"Color combination names","c":"Terms","d":"Community names from Ravnica guilds and Tarkir clans. Your decks: Azorius = white-blue (First Flight), Selesnya = green-white (Token Triumph), Jeskai = white-blue-red (Counter Intelligence, Riders of Rohan), Simic = green-blue (Elven Council), Abzan = white-black-green (Food and Fellowship), Grixis = blue-black-red (Hosts of Mordor). Also common: Rakdos = black-red, Izzet = blue-red, Boros = red-white."},{"t":"Legend rule","c":"Terms","d":"If you control two or more legendary permanents with the same name, you choose one to keep and put the rest into their owners' graveyards. It's per-player, so two players can each have their own copy of the same legend. Only names matter, not art or printing. (Fantastic Four's Council of Reeds sidesteps this, letting you keep multiples.)"},{"t":"Permanent","c":"Terms","d":"Any card on the battlefield: creatures, artifacts, enchantments, planeswalkers, lands."},{"t":"The Stack","c":"Terms","d":"Where spells and abilities wait to resolve. Last in, first out — the most recent thing resolves first."},{"t":"ETB","c":"Terms","d":"\"Enters the battlefield.\" An ETB trigger fires when a permanent comes into play."},{"t":"LTB / Dies","c":"Terms","d":"\"Leaves the battlefield.\" \"Dies\" specifically means a creature going to the graveyard from the battlefield."},{"t":"Mana value (MV)","c":"Terms","d":"The total amount of mana in a card's cost. (Formerly \"converted mana cost\" / CMC.)"},{"t":"Instant vs Sorcery speed","c":"Terms","d":"Instant speed = any time you have priority. Sorcery speed = only on your turn, main phase, empty stack."},{"t":"Counter","c":"Terms","d":"Two different meanings: (1) a marker on a permanent, like a +1/+1 counter; (2) to counter a spell means to cancel it while it's on the stack."},{"t":"Token","c":"Terms","d":"A game piece created by an effect (e.g. a 1/1 Soldier). Not a real card; it disappears for good when it leaves the battlefield."},{"t":"Ramp","c":"Terms","d":"Cards that accelerate your mana: extra lands, mana rocks like Sol Ring, mana dorks (creatures that tap for mana)."},{"t":"Removal","c":"Terms","d":"Spells that destroy, exile, or neutralize a threat. \"Spot removal\" hits one thing."},{"t":"Board wipe / Wrath","c":"Terms","d":"Mass removal that destroys many permanents at once (named after Wrath of God)."},{"t":"Summoning sickness","c":"Terms","d":"A creature can't attack or use tap abilities the turn it comes under your control, unless it has haste."},{"t":"Card advantage","c":"Terms","d":"Being up on resources — having more cards and options than your opponents."},{"t":"Value","c":"Terms","d":"Getting more out of a card than its cost, often through repeated or bonus effects."},{"t":"Voltron","c":"Terms","d":"Pile all your buffs and equipment onto one creature and win with it (often via commander damage)."},{"t":"Aristocrats","c":"Terms","d":"Sacrifice your own creatures for value; drain opponents' life."},{"t":"Tokens / Go-wide","c":"Terms","d":"Make lots of small creatures and overwhelm."},{"t":"Spellslinger","c":"Terms","d":"Built around casting lots of instants and sorceries."},{"t":"Stax","c":"Terms","d":"Slow the game down with taxing and locking effects."},{"t":"Group hug","c":"Terms","d":"Give everyone resources to steer the political game."},{"t":"Pillow fort","c":"Terms","d":"Defensive; make yourself hard to attack."},{"t":"Create (tokens)","c":"Keywords","d":"Put a token with the stated characteristics onto the battlefield. Almost every modern 'make a token' effect uses this word. Treasure, Food, Clue, Blood and other named tokens are all created this way."},{"t":"Destroy","c":"Keywords","d":"Move a permanent from the battlefield to its owner's graveyard. Only effects that say 'destroy' (or lethal damage / deathtouch damage) destroy a permanent. Sacrificing, exiling or bouncing is NOT destroying, so Indestructible only stops 'destroy' and damage. Regenerate replaces a destruction."},{"t":"Discard","c":"Keywords","d":"Move a card from your hand to your graveyard. You choose which card unless the effect says random or lets someone else choose. Discarding is not the same as milling or sacrificing."},{"t":"Reveal","c":"Keywords","d":"Show a card to all players for a moment. The card does not leave the zone it is in. Many costs and effects reveal a card from your hand or the top of your library."},{"t":"Shuffle","c":"Keywords","d":"Randomise a library so nobody knows the order. If you search for a card and then put it on top, the found card is not shuffled with the rest."},{"t":"Activate","c":"Keywords","d":"To use an activated ability: put it on the stack and pay its cost. Only the permanent's controller can do so, and only when they have priority, unless the card says otherwise."},{"t":"Attach","c":"Keywords","d":"Put an Aura, Equipment or Fortification onto an object or player. It can't be attached to something it couldn't enchant, equip or fortify. If an effect tries to attach it to something illegal it just stays where it was."},{"t":"Exchange","c":"Keywords","d":"Swap two things (life totals, control of two permanents, etc.). It is all or nothing: if any part of the swap can't happen, none of it does. Swapping control of two permanents with the same controller does nothing."},{"t":"Double (and Triple)","c":"Keywords","d":"Doubling a creature's power gives it +X/+0 where X is its power as the effect resolves; doubling toughness gives +0/+X; both gives +X/+Y. It is a temporary boost, not a permanent change of the printed number. Tripling gives +2X instead."},{"t":"Investigate","c":"Keywords","d":"Create a Clue token (an artifact: {2}, Sacrifice it: draw a card). Pairs with anything that likes artifacts, tokens or sacrifice."},{"t":"Explore","c":"Keywords","d":"Reveal the top card of your library. If it's a land, put it in your hand. If it isn't, put a +1/+1 counter on the exploring creature and you may put the revealed card into your graveyard (otherwise it stays on top)."},{"t":"Manifest","c":"Keywords","d":"Turn the top card of your library face down; it becomes a 2/2 creature with no name, text or mana cost. If it's a creature card you can turn it face up any time you have priority by paying its mana cost. (Non-creature cards stay face down.)"},{"t":"Manifest dread","c":"Keywords","d":"Look at the top two cards of your library. Manifest one of them (see Manifest), then put the other into your graveyard."},{"t":"Cloak","c":"Keywords","d":"Like Manifest, except the face-down 2/2 creature also has ward {2}. You can turn a cloaked creature card face up by paying its mana cost."},{"t":"Support","c":"Keywords","d":"'Support N' puts a +1/+1 counter on each of up to N other target creatures. On a creature, it can't target itself ('other'); on an instant or sorcery it can target any creature."},{"t":"Monstrosity","c":"Keywords","d":"'Monstrosity N': if this creature isn't monstrous, put N +1/+1 counters on it and it becomes monstrous. It only happens once because the creature stays monstrous (a marker that other cards can look for)."},{"t":"Meld","c":"Keywords","d":"Two specific cards (a meld pair) combine into one huge permanent when their abilities say so: both are exiled, then returned to the battlefield together with their back faces up. Only the two cards of the same pair can meld. If they can't be melded, they stay in exile."},{"t":"Learn","c":"Keywords","d":"You may discard a card; if you do, draw a card. (If you don't discard, you may fetch a Lesson from outside the game - in a normal Commander game there is nothing to fetch, so it's simply an optional rummage.)"},{"t":"Venture into the dungeon","c":"Keywords","d":"Start a dungeon (a mini adventure map kept in the command zone) and move your marker to the top room. Each later venture moves you one room down along an arrow; every room has an effect. Reach the bottom and the dungeon is completed. You can only venture a dungeon you choose from outside the game."},{"t":"Time travel","c":"Keywords","d":"Choose any number of your permanents and/or suspended cards with time counters. For each, add a time counter or remove one. Suspended cards cast sooner if you remove counters; Vanishing-style permanents live longer if you add them."},{"t":"Collect evidence","c":"Keywords","d":"'Collect evidence N': exile any number of cards from your graveyard with total mana value N or more. It is often an optional additional cost to a spell. You can't pay it if your graveyard can't reach N."},{"t":"Suspect","c":"Keywords","d":"A creature becomes 'suspected': it has menace and can't block until something removes the designation. A suspected creature can't be suspected again."},{"t":"Forage","c":"Keywords","d":"Exile three cards from your graveyard or sacrifice a Food. It's a cost used by some cards."},{"t":"Endure","c":"Keywords","d":"'Endure N': create an N/N white Spirit creature token, unless you choose to put N +1/+1 counters on the permanent instead."},{"t":"Blight","c":"Keywords","d":"'Blight N': put N -1/-1 counters on a creature you control. If you control no creature you can't choose to blight."},{"t":"Heal","c":"Keywords","d":"Remove damage that has been marked on a permanent. 'Damage is healed' effects clear all of it."},{"t":"Recruit","c":"Keywords","d":"Draw a card, then discard a card. If the card you discarded was a nonland card, create a 1/1 white Human Soldier creature token."},{"t":"Behold","c":"Keywords","d":"'Behold a [quality]': reveal a card of that quality from your hand or choose a permanent you control with that quality. It checks the quality at that moment, not afterwards."},{"t":"Empower Jace","c":"Keywords","d":"If you don't control a Jace planeswalker token, create a blue Jace planeswalker token with 0 loyalty and the abilities '-1: Surveil 1' and '-3: Draw a card'. Then put N loyalty counters on it."},{"t":"Face a villainous choice","c":"Keywords","d":"The player chooses one of two printed options (both usually bad for them) and the chosen option happens. They may choose an option even if it can't fully be done, and just do as much as possible."},{"t":"Shroud","c":"Keywords","d":"This permanent or player can't be the target of spells or abilities - yours included. Hexproof is the 'opponents only' version."},{"t":"Buyback","c":"Keywords","d":"An optional extra cost on an instant or sorcery. If you pay the buyback cost, the spell returns to your hand as it resolves instead of going to the graveyard, so you can cast it again."},{"t":"Madness","c":"Keywords","d":"If you would discard this card, you can exile it instead. Then you may cast it by paying its madness cost; if you don't, it goes to your graveyard. Works on any discard, including your own."},{"t":"Storm","c":"Keywords","d":"When you cast this spell, copy it once for each other spell cast before it this turn. Copies may choose new targets. Storm count includes every spell, not just yours or just spells of a certain type."},{"t":"Dredge","c":"Keywords","d":"Works only from your graveyard. 'Dredge N': if you would draw a card and your library has at least N cards, you may mill N cards and return this card from your graveyard to your hand instead of drawing."},{"t":"Split second","c":"Keywords","d":"While this spell is on the stack, nobody can cast spells or activate abilities that aren't mana abilities, so it can't be responded to with spells or abilities. Triggered abilities still trigger, and mana abilities and special actions still work."},{"t":"Suspend","c":"Keywords","d":"'Suspend N - cost': from your hand, pay the cost and exile the card with N time counters. At the beginning of your upkeep remove one. When the last is removed, cast it for free; a creature cast this way has haste."},{"t":"Changeling","c":"Keywords","d":"This card is every creature type, in every zone (even in the library or graveyard). It counts for any tribal bonus."},{"t":"Evoke","c":"Keywords","d":"You may cast this card for its evoke cost instead of its mana cost. If you did, it's sacrificed when it enters, but its enters-the-battlefield effects still happen. Often used as a cheap one-shot spell."},{"t":"Persist","c":"Keywords","d":"When this permanent dies, if it had no -1/-1 counters on it, return it to the battlefield with a -1/-1 counter on it. Works once - unless the counter is removed."},{"t":"Wither","c":"Keywords","d":"Damage this source deals to a creature isn't marked; it puts that many -1/-1 counters on it instead. It is a permanent shrink rather than damage that wears off at end of turn."},{"t":"Exalted","c":"Keywords","d":"Whenever a creature you control attacks alone (it's the only attacker), that creature gets +1/+1 until end of turn. Each instance of exalted triggers separately."},{"t":"Annihilator","c":"Keywords","d":"'Annihilator N': whenever this creature attacks, the defending player sacrifices N permanents of their choice. The trigger happens on attack, before blockers."},{"t":"Rebound","c":"Keywords","d":"On an instant or sorcery cast from your hand: exile it as it resolves instead of putting it in the graveyard, then at your next upkeep you may cast it from exile for free. A second use of the same spell for value."},{"t":"Umbra armor","c":"Keywords","d":"On an Aura. If the enchanted permanent would be destroyed, instead remove all damage from it and destroy this Aura. (Older cards say 'totem armor'.) It does not stop exile, sacrifice or -X/-X."},{"t":"Infect","c":"Keywords","d":"Damage this source deals to a creature is dealt as -1/-1 counters, and damage to a player is dealt as poison counters instead of life loss. 10 poison counters kills a player. Toxic and Poisonous are the milder cousins."},{"t":"Battle cry","c":"Keywords","d":"Whenever this creature attacks, each other attacking creature gets +1/+0 until end of turn."},{"t":"Soulbond","c":"Keywords","d":"Pairs this creature with another unpaired creature you control when either enters. While both stay paired and on the battlefield under your control, both get the printed bonus. The pairing ends if either leaves."},{"t":"Overload","c":"Keywords","d":"You may cast this spell for its overload cost instead of its mana cost. If you do, replace the word 'target' with 'each' in its text: it affects every legal object and has no targets."},{"t":"Scavenge","c":"Keywords","d":"From the graveyard: pay the scavenge cost and exile this card to put a number of +1/+1 counters equal to its power on target creature. Sorcery speed."},{"t":"Unleash","c":"Keywords","d":"You may have this creature enter with an extra +1/+1 counter. If you do, it can't block (for as long as it has the counter)."},{"t":"Extort","c":"Keywords","d":"Whenever you cast a spell, you may pay {W/B}. If you do, each opponent loses 1 life and you gain life equal to the total life lost this way. Each instance of extort triggers separately."},{"t":"Bestow","c":"Keywords","d":"Cast this creature for its bestow cost and it becomes an Aura that gives +stats to the enchanted creature. If the enchanted creature leaves the battlefield, the card stays on the battlefield as a creature instead of going to the graveyard."},{"t":"Exploit","c":"Keywords","d":"When this creature enters, you may sacrifice a creature (it may be itself). Cards with exploit have a bonus effect that triggers when you do."},{"t":"Renown","c":"Keywords","d":"'Renown N': when this creature deals combat damage to a player, if it isn't renowned, put N +1/+1 counters on it and it becomes renowned. It only happens once."},{"t":"Awaken","c":"Keywords","d":"'Awaken N - cost' on an instant or sorcery: pay the awaken cost instead of the mana cost and also put N +1/+1 counters on a land you control, which becomes a 0/0 Elemental creature with haste (it's still a land)."},{"t":"Devoid","c":"Keywords","d":"This card is colorless even though its mana cost has colored symbols. Those symbols still count toward its color identity (relevant in Commander)."},{"t":"Surge","c":"Keywords","d":"If you or a teammate has cast another spell this turn, you may pay the surge cost instead of the mana cost. In a 1v1 or pod game the 'teammate' part only matters in Two-Headed Giant."},{"t":"Emerge","c":"Keywords","d":"You may cast this spell by paying the emerge cost and sacrificing a creature; the total cost is reduced by the sacrificed creature's mana value. 'Emerge from [quality]' works with a different permanent type."},{"t":"Melee","c":"Keywords","d":"Whenever this creature attacks, it gets +1/+1 until end of turn for each opponent you attacked this combat. In a 4-player pod this can be up to +3/+3."},{"t":"Crew","c":"Keywords","d":"The Vehicle's activated ability: tap untapped creatures you control with total power N or more and it becomes an artifact creature until end of turn. Summoning-sick creatures can crew. See Vehicles for the full rules."},{"t":"Eternalize","c":"Keywords","d":"From the graveyard: pay the cost and exile this card to create a 4/4 black Zombie token copy of it with no mana cost. Sorcery speed. Embalm is the similar ability that makes a white Zombie copy of the card instead, keeping the original's stats."},{"t":"Afflict","c":"Keywords","d":"'Afflict N': whenever this creature becomes blocked, the defending player loses N life. The blocker needs to be willing to take the loss or not block at all."},{"t":"Ascend","c":"Keywords","d":"'Ascend' on a permanent: if you control ten or more permanents, you get the city's blessing for the rest of the game (permanent). On an instant or sorcery, it checks at resolution. Other cards check whether you have the city's blessing."},{"t":"Assist","c":"Keywords","d":"Another player of your choice may pay some or all of the generic mana in this spell's cost. A political tool in pod games."},{"t":"Jump-start","c":"Keywords","d":"Cast this instant or sorcery from your graveyard by discarding a card as an additional cost. If it was cast with jump-start it's exiled afterwards instead of returning to the graveyard."},{"t":"Afterlife","c":"Keywords","d":"'Afterlife N': when this permanent dies, create N 1/1 white and black Spirit creature tokens with flying."},{"t":"Riot","c":"Keywords","d":"As this permanent enters you choose: put a +1/+1 counter on it, or it gains haste. It chooses once on entering."},{"t":"Spectacle","c":"Keywords","d":"If an opponent lost life this turn, you may cast this spell for its spectacle cost instead of its mana cost."},{"t":"Escape","c":"Keywords","d":"Cast this card from your graveyard for its escape cost (usually mana plus exiling other cards from your graveyard). Often returns with extra counters. It's a repeatable value engine, not a one-off like flashback."},{"t":"Mutate","c":"Keywords","d":"Cast this creature for its mutate cost targeting a non-Human creature you own. If it resolves it merges with the target: you choose whether it goes on top or underneath, the result is one creature with the top card's name and stats and all the abilities of every merged card. If the target becomes illegal, it enters as a normal creature."},{"t":"Boast","c":"Keywords","d":"'Boast - cost: effect': activate only if this creature attacked this turn, and only once each turn."},{"t":"Demonstrate","c":"Keywords","d":"When you cast this spell, you may copy it. If you do, choose an opponent: they also copy it. You may choose new targets for your copy, they choose for theirs."},{"t":"Daybound / Nightbound","c":"Keywords","d":"Double-faced cards that flip with the game's day and night. If no one has a daybound permanent, it's neither day nor night; as soon as one appears it becomes day. At each untap step it becomes night if the previous active player cast no spells, and day again if the previous active player cast two or more spells. Permanents transform automatically when it changes."},{"t":"Disturb","c":"Keywords","d":"Cast this card from the graveyard transformed (back face up) for the disturb cost. It enters with its back face up."},{"t":"Decayed","c":"Keywords","d":"This creature can't block, and when it attacks it is sacrificed at end of combat."},{"t":"Cleave","c":"Keywords","d":"You may cast this spell for its cleave cost instead of its mana cost. If you do, ignore all the text in [square brackets] on the card."},{"t":"Training","c":"Keywords","d":"Whenever this creature attacks alongside another creature with greater power, put a +1/+1 counter on it."},{"t":"Compleated","c":"Keywords","d":"On a planeswalker with Phyrexian mana in its cost: if you paid life for any of those symbols, it enters with fewer loyalty counters (two fewer for each symbol paid with life)."},{"t":"Reconfigure","c":"Keywords","d":"An Equipment creature. Pay the cost (sorcery speed) to attach it to another creature you control, or pay again to unattach it. While attached it is not a creature."},{"t":"Casualty","c":"Keywords","d":"'Casualty N': as you cast this spell, you may sacrifice a creature with power N or greater. If you do, copy the spell when you cast it. Copies may choose new targets."},{"t":"Enlist","c":"Keywords","d":"As this creature attacks, you may tap up to one untapped nonattacking creature you control (summoning sickness matters: it must have haste or have been under your control since the start of turn). This creature gets +X/+0, where X is the tapped creature's power."},{"t":"Read ahead","c":"Keywords","d":"A Saga ability: as it enters, choose a chapter and it enters with that many lore counters, and chapters can't trigger on the entering turn unless the chosen chapter matches. Lets you skip straight to a later chapter."},{"t":"Ravenous","c":"Keywords","d":"Appears on creatures with {X} in the cost. It enters with X +1/+1 counters, and when it enters, if X is 5 or more, draw a card."},{"t":"Squad","c":"Keywords","d":"'Squad - cost': as an additional cost to cast this creature you may pay this cost any number of times. When it enters, create a token copy of it for each time you paid."},{"t":"Prototype","c":"Keywords","d":"A prototype card can be cast as a smaller, cheaper version with its own mana cost, power and toughness (the second set printed on the card). It keeps all its other characteristics."},{"t":"Toxic","c":"Keywords","d":"'Toxic N': whenever this creature deals combat damage to a player, that player gets N poison counters in addition to normal damage. Unlike Infect, it still hits for life loss."},{"t":"Backup","c":"Keywords","d":"'Backup N': when this creature enters, put N +1/+1 counters on target creature. If it's another creature, it also gains this creature's abilities listed below the backup line until end of turn."},{"t":"Bargain","c":"Keywords","d":"As an additional cost to cast this spell you may sacrifice an artifact, enchantment or token. Many spells get a bonus if they were bargained."},{"t":"Disguise","c":"Keywords","d":"You may cast this card face down as a 2/2 creature with ward {2} for {3}. You can turn it face up any time you have priority by paying its disguise cost. Like Morph, with ward."},{"t":"Solved","c":"Keywords","d":"Found on Case enchantments. 'Solved - [ability]' means the ability only works once that Case is solved (when its 'to solve' condition is true at your end step)."},{"t":"Plot","c":"Keywords","d":"From your hand, once during your main phase with an empty stack, pay the plot cost and exile it. On a later turn you may cast it for free at sorcery speed."},{"t":"Spree","c":"Keywords","d":"A modal spell where you choose one or more modes, and pay each chosen mode's extra cost in addition to the base cost. Look for the + symbol."},{"t":"Freerunning","c":"Keywords","d":"If a player was dealt combat damage this turn by an Assassin or your commander, you may pay the freerunning cost instead of the mana cost."},{"t":"Offspring","c":"Keywords","d":"'Offspring - cost': you may pay an additional cost when casting this creature. If you did, when it enters create a 1/1 token copy of it."},{"t":"Impending","c":"Keywords","d":"'Impending N - cost': you may cast this for the impending cost instead. If you did, it enters with N time counters and isn't a creature while it has any; a counter is removed at the beginning of your end step. When the last counter is removed it's a normal creature."},{"t":"Start your engines! / Max speed","c":"Keywords","d":"A speed system. The first time you control a permanent with this you get speed 1. Whenever an opponent loses life on your turn, your speed goes up by 1 (once per turn, max 4). 'Max speed' abilities turn on when your speed is 4."},{"t":"Harmonize","c":"Keywords","d":"Cast this card from your graveyard for the harmonize cost and tap up to one untapped creature you control; the cost is reduced by that creature's power. Exiled afterwards."},{"t":"Mobilize","c":"Keywords","d":"'Mobilize N': whenever this creature attacks, create N 1/1 red Warrior tokens tapped and attacking. Sacrifice them at the beginning of the next end step."},{"t":"Sneak","c":"Keywords","d":"During your declare blockers step you may cast this by paying its sneak cost and returning an unblocked creature you control to hand. If it's a creature spell it enters tapped and attacking the same target as the returned creature."},{"t":"Increment","c":"Keywords","d":"Whenever you cast a spell, if the mana spent on it is greater than this creature's power or toughness, put a +1/+1 counter on it."},{"t":"Paradigm","c":"Keywords","d":"An instant/sorcery you exile the first time it resolves each game. At the beginning of each of your precombat main phases afterwards you may cast a copy of it from exile for free."},{"t":"Teamwork","c":"Keywords","d":"'Teamwork N': as an additional cost to cast this spell you may tap any number of creatures you control with total power N or more. Many spells get an extra effect if you did."},{"t":"Craft","c":"Keywords","d":"'Craft with [materials] - cost': pay the cost, exile this permanent and the listed materials (from your battlefield and/or graveyard). Return this card transformed to the battlefield. Sorcery speed."},{"t":"Living weapon","c":"Keywords","d":"When this Equipment enters, create a 0/0 black Phyrexian Germ token and attach the Equipment to it."},{"t":"For Mirrodin!","c":"Keywords","d":"When this Equipment enters, create a 2/2 red Rebel token and attach the Equipment to it."},{"t":"∞ (Infinity)","c":"Keywords","d":"A keyword on Infinity cards. '∞ - [ability]' means the permanent has that ability as long as it is harnessed. See Harness."},{"t":"Space sculptor","c":"Keywords","d":"One card has it (Space Beleren). Creatures on the battlefield get 'sector' designations (alpha, beta, gamma) chosen by their controllers as long as that permanent is around."},{"t":"Planeswalk","c":"Old & Niche","d":"Only in Planechase games: put the face-up plane on the bottom of the planar deck and turn the next plane face up."},{"t":"Adamant","c":"Keywords","d":"If at least three mana of one color was spent to cast the spell, you get a bonus (e.g. enters with a +1/+1 counter). (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Alliance","c":"Keywords","d":"Whenever another creature enters under your control, the card does something (e.g. +1/+1 until end of turn). (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Celebration","c":"Keywords","d":"Checks whether two or more nonland permanents entered under your control this turn. If so, the card gets a bonus. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Channel","c":"Keywords","d":"Pay the channel cost and discard this card from your hand to get the effect listed. It is an activated ability that works from your hand."},{"t":"Coven","c":"Keywords","d":"Checks whether you control three or more creatures with different powers. If so the card gets a bonus or unlocks an ability. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Descend 4 / Descend 8","c":"Keywords","d":"Checks how many permanent cards are in your graveyard. 'Descend 4' needs four or more, 'Descend 8' needs eight or more, for the listed bonus. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Disappear","c":"Keywords","d":"Triggers if a permanent left the battlefield under your control this turn. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Domain","c":"Keywords","d":"Counts the number of different basic land types among lands you control. 'Domain' cards care about having Plains, Island, Swamp, Mountain and Forest. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Eerie","c":"Keywords","d":"Triggers whenever an enchantment you control enters, and whenever you fully unlock a Room. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Eminence","c":"Keywords","d":"Used on commander cards such as Arahbo. The ability works from the command zone as well as the battlefield, so it helps even before the commander is cast. The card text says exactly where it works."},{"t":"Enrage","c":"Keywords","d":"Triggers whenever this creature is dealt damage. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Ferocious","c":"Keywords","d":"Checks whether you control a creature with power 4 or greater. If so, the card gets a bonus. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Flurry","c":"Keywords","d":"Triggers when you cast your second spell each turn. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Magecraft","c":"Keywords","d":"Triggers whenever you cast or copy an instant or sorcery spell. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Morbid","c":"Keywords","d":"Checks whether a creature died this turn. If so, the card gets a bonus. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Opus","c":"Keywords","d":"Triggers whenever you cast an instant or sorcery. A bigger bonus if five or more mana was spent on it. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Pack tactics","c":"Keywords","d":"Checks whether you attacked with creatures whose total power is 6 or greater. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Paradox","c":"Keywords","d":"Triggers whenever you cast a spell from anywhere other than your hand. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Rally","c":"Keywords","d":"Triggers when this creature or another Ally enters under your control. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Renew","c":"Keywords","d":"Works from your graveyard: pay the cost and exile this card to get the effect, usually a counter on a creature. Sorcery speed. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Repartee","c":"Keywords","d":"Triggers when you cast an instant or sorcery spell that targets a creature. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Survival","c":"Keywords","d":"At the beginning of your second main phase, checks whether the creature is tapped (e.g. put a flying counter on it). (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Valiant","c":"Keywords","d":"Triggers the first time each turn this creature becomes the target of a spell or ability you control. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Vivid","c":"Keywords","d":"Counts the number of colors among permanents you control. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Void","c":"Keywords","d":"Checks whether a nonland permanent left the battlefield this turn, or a spell was warped this turn. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Corrupted","c":"Keywords","d":"Checks whether an opponent has three or more poison counters. (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Secret council","c":"Keywords","d":"Each player secretly votes, then votes are revealed, and results apply (see Voting). (An ability word is an italic label with no rules meaning - the card text after the dash says what happens.)"},{"t":"Basic landcycling","c":"Keywords","d":"Pay the cost and discard this card to search your library for a basic land card, put it in your hand and shuffle. Like Typecycling, it gets a land instead of a random draw."},{"t":"Megamorph","c":"Keywords","d":"Like Morph, but the creature gets a +1/+1 counter when turned face up. Cast it face down as a 2/2 for {3}, then turn it up any time for its megamorph cost."},{"t":"Role token","c":"Keywords","d":"An Aura token attached to a creature, with the effect printed on the Role. A creature can only have one Role from each controller: a new Role from you replaces the old one from you. Example: Cursed Role makes the enchanted creature a 1/1."},{"t":"Legendary / Nonbasic landwalk","c":"Keywords","d":"Same as Landwalk, but the condition is different: it can't be blocked as long as the defending player controls a legendary land (or nonbasic land)."},{"t":"Doctor's companion","c":"Commander","d":"A Commander-legal pairing keyword. A creature with this can be your second commander if your other commander is a Doctor (from Doctor Who)."},{"t":"Banding","c":"Old & Niche","d":"An old combat ability. When attackers are declared, creatures with banding (plus at most one creature without) can form a 'band': if any member is blocked, all are. If a creature with banding is blocking or being blocked, the controller of the banded creature splits the combat damage instead of the opponent. Most players find it very confusing - rare in modern cards. ('Bands with other [quality]' is a limited version.)"},{"t":"Rampage","c":"Old & Niche","d":"'Rampage N': whenever this creature becomes blocked, it gets +N/+N for each creature blocking it beyond the first. Calculated once."},{"t":"Cumulative upkeep","c":"Old & Niche","d":"At the beginning of your upkeep, put an age counter on it, then pay its cost once for each age counter or sacrifice it. The cost increases every turn."},{"t":"Flanking","c":"Old & Niche","d":"Whenever this creature becomes blocked by a creature without flanking, the blocker gets -1/-1 until end of turn."},{"t":"Phasing","c":"Old & Niche","d":"At the start of your untap step, permanents with phasing you control 'phase out' (treated as if they don't exist, with counters and attachments kept) and those that phased out earlier phase back in. It doesn't trigger leaves-the-battlefield or enters-the-battlefield effects."},{"t":"Shadow","c":"Old & Niche","d":"Can block or be blocked only by creatures with shadow. Strictly evasive both ways."},{"t":"Echo","c":"Old & Niche","d":"At the beginning of your upkeep, if this came under your control since your last upkeep, sacrifice it unless you pay its echo cost. After that turn it's free."},{"t":"Horsemanship","c":"Old & Niche","d":"Can't be blocked except by creatures with horsemanship, but it can block any creature. An old 'super flying'."},{"t":"Fading","c":"Old & Niche","d":"'Fading N': enters with N fade counters. At the beginning of your upkeep remove a fade counter; if you can't, sacrifice it."},{"t":"Fear","c":"Old & Niche","d":"Can't be blocked except by artifact creatures and/or black creatures. (See Intimidate for the similar color-based version.)"},{"t":"Amplify","c":"Old & Niche","d":"'Amplify N': as it enters, reveal any number of cards from
