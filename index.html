const q = document.getElementById('q');
const list = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const emptyQ = document.getElementById('emptyq');
const clearBtn = document.getElementById('clear');
let cat = "Keywords";

CATS.forEach(c=>{
  const b=document.createElement('button');
  b.className='chip'+(c===cat?' on':'');
  b.textContent=c;
  b.onclick=()=>{cat=c;[...chipsEl.children].forEach(x=>x.classList.toggle('on',x.textContent===c));render();};
  chipsEl.appendChild(b);
});

function mana(s){
  return s.replace(/\{([^}]+)\}/g,(_,t)=>{
    const u=t.toUpperCase();
    const cls={W:'w',U:'u',B:'b',R:'r',G:'g'}[u]||'';
    const wide=t.length>1?' wide':'';
    return `<span class="ms ${cls}${wide}">${u==='T'?'<span class="tp">\u21b7</span>':t.toUpperCase()}</span>`;
  });
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function hl(html,term){
  if(!term) return html;
  const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  // only highlight outside tags
  return html.split(/(<[^>]+>)/g).map(part=>part.startsWith('<')?part:part.replace(re,'<mark>$1</mark>')).join('');
}

function render(){
  const term=q.value.trim();
  clearBtn.style.display=term?'block':'none';
  const tl=term.toLowerCase();
  let out=[];
  if(cat!=="Cards"){
    const rows=DATA.filter(e=>e.c===cat);
    if(term){
      rows.forEach(e=>{
        const t=e.t.toLowerCase(), d=e.d.replace(/<[^>]+>/g,'').toLowerCase();
        if(t.startsWith(tl)) out.push([0,'g',e]);
        else if(t.includes(tl)) out.push([1,'g',e]);
        else if(d.includes(tl)) out.push([2,'g',e]);
      });
    } else {
      rows.forEach(e=>out.push([1,'g',e]));
    }
  }
  if(term && cat!=="Old & Niche" && cat!=="Cards"){
    DATA.forEach(e=>{
      if(e.c!=="Old & Niche") return;
      const t=e.t.toLowerCase(), d=e.d.replace(/<[^>]+>/g,'').toLowerCase();
      if(t.startsWith(tl)) out.push([6,'g',e]);
      else if(t.includes(tl)) out.push([7,'g',e]);
      else if(d.includes(tl)) out.push([8,'g',e]);
    });
  }
  if(term){
    CARDS.forEach(c=>{
      const n=c.n.toLowerCase(), o=(c.o+' '+c.y).toLowerCase();
      if(n.startsWith(tl)) out.push([3,'c',c]);
      else if(n.includes(tl)) out.push([4,'c',c]);
      else if(o.includes(tl)) out.push([5,'c',c]);
    });
  } else if(cat==="Cards"){
    CARDS.forEach(c=>out.push([4,'c',c]));
  }
  out.sort((a,b)=>a[0]-b[0] || (a[1]==='c'?a[2].n:a[2].t).localeCompare(b[1]==='c'?b[2].n:b[2].t));
  const total=out.length, CAP=(term||cat==="Cards")?100:1000;
  const shown=out.slice(0,CAP);
  countEl.textContent=total?`${total} ${total===1?'result':'results'}${total>CAP?` — showing first ${CAP}, keep typing`:''}`:'';
  emptyEl.style.display=total?'none':'block';
  emptyQ.textContent=term;
  list.innerHTML=shown.map(([s,k,e])=>{
    if(k==='g'){
      const isHtml=e.d.startsWith('<');
      const body=isHtml?hl(e.d,term):'<p>'+hl(esc(e.d),term)+'</p>';
      return `<div class="entry"><h2><span class="nm">${hl(esc(e.t),term)}</span><span class="cat">${e.c}</span></h2>${body}</div>`;
    }
    const body=e.o?e.o.split('\n').map(l=>'<p>'+hl(mana(esc(l)),term)+'</p>').join(''):'';
    const pt=e.pt?' — '+esc(e.pt):'';
    return `<div class="entry card"><h2><span class="nm">${hl(esc(e.n),term)}</span><span class="mana">${mana(esc(e.m))}</span></h2><div class="typeline">${esc(e.y)}${pt} · ${esc(e.s)}</div>${body}</div>`;
  }).join('');
}


if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let deferred=null; const dl=document.getElementById('dl');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;dl.hidden=false;});
dl.onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice;}catch(_){}deferred=null;dl.hidden=true;};
window.addEventListener('appinstalled',()=>{dl.hidden=true;});
q.addEventListener('input',render);
clearBtn.onclick=()=>{q.value='';render();q.focus();};
render();
</script>
</body>
</html>
