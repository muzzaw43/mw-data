name: Check card sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the update decision script
        run: |
          mkdir -p staging
          { echo "# needs_update check ($(date -u +%A))"; python needs_update.py; python - <<'PY'
          import json, urllib.request
          req = urllib.request.Request("https://mtgjson.com/api/v5/SetList.json", headers={"User-Agent": "mw-data-updater"})
          sets = json.load(urllib.request.urlopen(req))["data"]
          print("set types:", sorted({s.get("type") for s in sets}))
          print("latest sets:", [(s["code"], s["releaseDate"], s.get("type")) for s in sorted(sets, key=lambda x: x["releaseDate"])[-6:]])
          PY
          } > staging/SOURCE_CHECK.md 2>&1
          git config user.name github-actions; git config user.email actions@github.com
          git add staging/SOURCE_CHECK.md; git commit -m "Source check result"; git push
