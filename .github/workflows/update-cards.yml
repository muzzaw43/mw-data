name: Update card database

# Scheduled (daily 03:17 UTC): rebuild the live mtg_cards_slim.json straight from MTGJSON when
#   - it is Monday (weekly run), or
#   - a set released in the last 45 days still has cards missing from the live file (new set not fully registered).
#   Scheduled builds are sanity-checked and only published if they pass; nothing is committed if nothing changed.
# Manual: run without "publish" to stage a file in staging/ (live file untouched); with "publish" ticked to copy the staged file over the live one.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Copy the staged file (staging/mtg_cards_slim.json) over the live mtg_cards_slim.json"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the builder
        run: python test_build_slim.py mtg_cards_slim.json

      - name: Scheduled run - is an update needed?
        id: need
        if: ${{ github.event_name == 'schedule' }}
        run: |
          r="$(python needs_update.py)"
          echo "$r"
          echo "answer=${r%% *}" >> "$GITHUB_OUTPUT"
          echo "Update check: $r" >> "$GITHUB_STEP_SUMMARY"

      - name: Scheduled run - build and publish live
        if: ${{ github.event_name == 'schedule' && steps.need.outputs.answer == 'yes' }}
        run: |
          python build_slim.py --out new_slim.json --summary staging/SUMMARY.md
          python - <<'PY'
          import json
          old = json.load(open("mtg_cards_slim.json", encoding="utf-8"))
          new = json.load(open("new_slim.json", encoding="utf-8"))
          removed = set(old) - set(new)
          # Guard: the "A-" Arena cards are expected to disappear; anything else disappearing in bulk is suspicious.
          other = [r for r in removed if not r.startswith("A-")]
          assert len(other) < 50, f"{len(other)} non-Alchemy cards would be removed, not publishing: {other[:10]}"
          PY
          mv new_slim.json mtg_cards_slim.json
          rm -f staging/mtg_cards_slim.json
          git config user.name "card-db-updater"
          git config user.email "actions@users.noreply.github.com"
          git add mtg_cards_slim.json staging
          git commit -m "Auto-update card database ($(date -u +%F))" || echo "no changes"
          git push

      - name: Publish the staged file
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          test -f staging/mtg_cards_slim.json || { echo "Nothing staged yet - run without 'publish' first."; exit 1; }
          python - <<'PY'
          import json
          n = json.load(open("staging/mtg_cards_slim.json", encoding="utf-8"))
          assert len(n) > 30000 and "Sol Ring" in n, "staged file looks wrong"
          PY
          cp staging/mtg_cards_slim.json mtg_cards_slim.json
          rm -f staging/mtg_cards_slim.json
          git config user.name "card-db-updater"
          git config user.email "actions@users.noreply.github.com"
          git add mtg_cards_slim.json staging
          git commit -m "Publish staged card database ($(date -u +%F))" || echo "no changes"
          git push

      - name: Build a new staged file
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: python build_slim.py --out staging/mtg_cards_slim.json --summary staging/SUMMARY.md

      - name: Commit the staged file and summary
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          git config user.name "card-db-updater"
          git config user.email "actions@users.noreply.github.com"
          git add staging
          git commit -m "Stage card database update ($(date -u +%F))" || echo "no changes"
          git push

      - name: Show the summary
        if: always()
        run: cat staging/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
